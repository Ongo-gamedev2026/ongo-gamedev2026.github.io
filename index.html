<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>온고 게임제작반 2026</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="town.js"></script>
<script src="write.js"></script>
<style>
:root{
  --bg:#f2f3f5; --card:#fff; --ink:#111; --sub:#666; --line:#e3e5e8;
  --accent:#ff6b1a; --ok:#16a34a; --ok-bg:#e8f7ee; --v2:#2563eb; --v2-bg:#e8efff;
  --none:#8a8f98; --none-bg:#f0f1f3; --side:#fff; --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}

/* layout */
.app{display:flex;min-height:100vh}
.side{width:248px;flex:none;background:var(--side);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 12px 24px}
.main{flex:1;min-width:0;padding:28px 32px 60px}
.brand{display:block;padding:4px 12px 18px;font-weight:800;font-size:18px}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--sub)}
.nav a,.nav button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:10px;color:#333;font-size:14.5px}
.nav a:hover,.nav button:hover{background:#f4f5f7}
.nav .on{background:#fff1e8;color:#c2410c;font-weight:700}
.wk-btn .caret{width:14px;color:#999;transition:transform .15s}
.wk.open .caret{transform:rotate(90deg)}
.wk-btn b{font-weight:700;white-space:nowrap;flex:none}
.wk-btn span.t{min-width:0}
.wk-btn span.t{color:var(--sub);font-size:12.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.wk-list{display:none;padding:2px 0 6px 22px}
.wk.open .wk-list{display:block}
.wk-list a{font-size:14px;padding:6px 12px}
.dot{width:8px;height:8px;border-radius:50%;background:#d4d7dc;flex:none}
.dot.v1{background:var(--ok)} .dot.v2{background:var(--v2)}
.nav hr{border:0;border-top:1px solid var(--line);margin:12px 8px}
.roster{margin:14px 8px 0;padding:10px 12px;border-radius:10px;background:#f7f7f8;font-size:12.5px;color:var(--sub)}
.roster button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 8px;font-size:12.5px;margin-top:6px}
.btn.menu-toggle{display:none}

/* rows (home) */
.hero{margin:0 0 30px}
.hero h1{font-size:26px;margin:0 0 4px}
.hero p{margin:0;color:var(--sub)}
.row{margin:0 0 40px}
.row-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.row-head h2{font-size:22px;margin:0;font-weight:800}
.row-head h2 em{font-style:normal;color:var(--accent)}
.row-head .grow{flex:1}
.row-head .more{white-space:nowrap;text-decoration:underline;text-underline-offset:4px;color:#333}
.arrow{width:38px;height:38px;border-radius:50%;border:0;background:#111;color:#fff;font-size:18px;display:grid;place-items:center}
.arrow.prev{background:#e4e5e8;color:#fff}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 48px)/3);gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:6px}
.strip::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px}

/* card */
.card{scroll-snap-align:start;background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05);display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.thumb{position:relative;aspect-ratio:16/9;overflow:hidden;display:flex;align-items:flex-end;padding:18px 22px}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .big{position:relative;font-size:52px;font-weight:900;line-height:1;letter-spacing:-1px}
.thumb .big small{display:block;font-size:15px;font-weight:700;letter-spacing:0;opacity:.85;margin-bottom:6px}
.thumb .deco{position:absolute;right:18px;bottom:10px;font-size:64px;opacity:.9}
.pill{position:absolute;top:16px;left:16px;z-index:1;color:#111;display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--none)}
.pill.v1 i{background:var(--ok)} .pill.v2 i{background:var(--v2)}
.card-body{padding:18px 22px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-title{font-weight:800;font-size:17px}
.card-date{color:var(--sub);font-size:14px;min-height:21px}
.card-meta{display:flex;gap:14px;color:#555;font-size:13.5px;margin-top:auto;padding-top:8px}

/* detail */
.crumb{color:var(--sub);font-size:14px;margin-bottom:10px}
.crumb a:hover{text-decoration:underline}
.detail-top{display:grid;grid-template-columns:minmax(0,360px) 1fr;gap:28px;background:#fff;border-radius:var(--radius);padding:22px;margin-bottom:24px}
.detail-top .thumb{border-radius:12px}
.detail-info h1{margin:2px 0 4px;font-size:24px}
.detail-info .topic{color:var(--sub);margin:0 0 14px}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-weight:700;font-size:13.5px;background:var(--none-bg);color:var(--none)}
.badge.v1{background:var(--ok-bg);color:var(--ok)} .badge.v2{background:var(--v2-bg);color:var(--v2)}
.history{margin:14px 0;padding:0;list-style:none;font-size:14px}
.history li{padding:4px 0;color:#333}
.history li a{color:var(--v2);text-decoration:underline}
.pn{margin:4px 0 8px;font-size:14px}.pn summary{cursor:pointer;color:var(--sub)}.pn .md{background:#f7f8fa;border-radius:8px;padding:8px 12px;margin-top:4px}.pn .md h2{font-size:14px;margin:4px 0;padding:0;background:none;border:0}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px}
.btn:hover{background:#f6f7f8}
.btn.primary{background:#111;color:#fff;border-color:#111}
.btn.primary:hover{background:#333}
.hint{font-size:12.5px;color:var(--sub);margin-top:8px}
.doc-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:14px}
.tab.on{background:#111;color:#fff;border-color:#111}
.doc-bar select{margin-left:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;font-size:14px;background:#fff}
.paper{background:#fff;border-radius:var(--radius);padding:34px 40px;min-height:200px}
.empty{color:var(--sub);text-align:center;padding:40px 10px}

/* markdown */
.md h1{font-size:24px;margin:0 0 12px;padding-bottom:10px;border-bottom:2px solid #111}
.md h2{font-size:18px;margin:26px 0 8px;padding:6px 10px;background:#f4f5f7;border-left:4px solid var(--accent);border-radius:4px}
.md h3{font-size:16px;margin:18px 0 6px}
.md h4{font-size:15px;margin:14px 0 4px}
.md p,.md li{margin:4px 0}
.md .ex{color:#8a8f98;font-size:14px}
.md .ans{border-bottom:1px solid #cfd3d8;padding-bottom:6px;min-height:32px}
.md .ans strong:first-child{color:var(--accent)}
.md blockquote{margin:10px 0;padding:8px 14px;background:#fff8f2;border-radius:8px;color:#7c4a1e}
.md table{border-collapse:collapse;width:100%;margin:8px 0}
.md th,.md td{border:1px solid #bbb;padding:6px 8px;text-align:left}
.md th{background:#f4f5f7}
.md code{background:#f4f5f7;border-radius:4px;padding:1px 4px}
.md pre{background:#f4f5f7;padding:10px 12px;border-radius:8px;white-space:pre-wrap}
.md ul{padding-left:22px}
.md li:has(> input[type=checkbox]){list-style:none;margin-left:-20px}
.md img{max-width:100%}

/* status table */
.tbl-wrap{background:#fff;border-radius:var(--radius);padding:8px;overflow-x:auto}
table.status{border-collapse:collapse;width:100%;min-width:640px}
table.status th,table.status td{padding:12px 10px;text-align:center;border-bottom:1px solid var(--line)}
table.status th{font-size:13.5px;color:var(--sub);font-weight:600}
table.status td:first-child,table.status th:first-child{text-align:left;font-weight:700}
table.status tr:last-child td{border-bottom:0}
table.status a.badge:hover{filter:brightness(.95)}

/* print view */
.print-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.print-bar .note{color:var(--sub);font-size:13px}
.sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto 24px;padding:16mm 16mm 18mm;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.sheet-head{width:100%;border-collapse:collapse;margin:0 0 14px;font-size:13.5px}
.sheet-head td{border:1px solid #333;padding:7px 8px;height:34px}
.sheet-head td.k{background:#f1f2f4;font-weight:700;width:13%;text-align:center;white-space:nowrap}
.sheet .md h1{font-size:22px}
.sheet .md blockquote.howto{display:none}

/* write (작성하기) */
.wr-key{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;margin-bottom:14px}
.wr-key.on{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 16px;background:var(--ok-bg);border-color:#bfe5cc;font-size:14px}
.wr-key.on span{flex:1;min-width:200px}
.wr-key.on .hint{flex-basis:100%;margin:0}
.wr-key-title{font-weight:800;margin-bottom:4px}
.wr-key-row{display:flex;gap:8px}
.wr-key-row input{flex:1;min-width:0;font:inherit;border:1px solid #cfd3d8;border-radius:10px;padding:9px 12px}
.wr-remember{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);margin-top:8px}
.wr .wr-raw > :first-child{margin-top:0}
.wr-label{font-weight:700;margin:10px 0 4px}
.wr-label p{margin:0}
.wr-in,.wr-cell{display:block;width:100%;font:inherit;line-height:1.5;color:var(--ink);background:#fffaf5;border:1.5px solid #f0d9c6;border-radius:10px;padding:8px 12px;resize:none;overflow:hidden;min-height:40px}
.wr-in:focus,.wr-cell:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px #ffe3d1}
.wr-in::placeholder,.wr-cell::placeholder{color:#b9a999}
.wr-in.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.wr-ans{margin:6px 0 14px}
.wr-field{display:grid;grid-template-columns:minmax(90px,auto) 1fr;align-items:center;gap:10px;margin:8px 0}
.wr-field .wr-label{margin:0}
.wr-list,.wr-code{margin:6px 0 12px}
.wr-chk{display:flex;align-items:center;gap:8px;margin:6px 0;cursor:pointer}
.wr-chk input{width:18px;height:18px;accent-color:var(--accent)}
.wr-table{overflow-x:auto;margin:8px 0 14px}
.wr-table table{border-collapse:collapse;width:100%;min-width:480px}
.wr-table th,.wr-table td{border:1px solid #d5d8dc;padding:6px 8px;text-align:left;vertical-align:middle}
.wr-table th{background:#f4f5f7;font-size:14px}
.wr-table td.ro{background:#fafafa;font-size:14px;white-space:nowrap}
.wr-table td.ex{color:#8a8f98}
.wr-table td.in{padding:4px}
.wr-table .wr-cell{border-color:transparent;background:#fffaf5;min-height:36px;padding:6px 8px}
.wr-add{margin-top:6px;border:1px dashed #cfd3d8;background:#fff;border-radius:8px;padding:5px 12px;font-size:13px;color:var(--sub)}
.wr-add:hover{border-color:var(--accent);color:var(--accent)}
.wr-bar{position:sticky;bottom:12px;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px;padding:10px 12px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.wr-status{flex:1;min-width:160px;font-size:13.5px;color:var(--sub);margin:0}
.wr-status.ok{color:var(--ok);font-weight:600}
.wr-status.warn{color:#c2410c;font-weight:600}
.wr-status.err{color:#dc2626;font-weight:600}
.wr-modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.4);display:grid;place-items:center;padding:16px}
.wr-dialog{width:min(520px,100%);background:#fff;border-radius:var(--radius);padding:22px 24px}
.wr-dialog h3{margin:0 0 8px;font-size:19px}
.wr-dialog p{margin:0 0 10px;color:#333}
.wr-dialog .wr-in{overflow:auto}
.tip-btn{display:inline-grid;place-items:center;width:22px;height:22px;margin-left:6px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-weight:800;font-size:13px;line-height:1;cursor:pointer;vertical-align:middle;box-shadow:0 0 0 3px #ffe3d1}
.tip-btn:hover{filter:brightness(1.08)}
.tip-dialog{max-height:86vh;overflow-y:auto}
.tip-dialog .tip-h{font-weight:800;margin:14px 0 6px}
.tip-dialog .tip-list{margin:0;padding-left:20px}
.tip-dialog .tip-list li{margin:0 0 6px}
.tip-dialog .tip-list span{color:var(--sub);font-size:14px}
.tip-dialog .tip-ex{background:#f4f5f7;border-radius:8px;padding:8px 12px;font-size:14px;margin-top:8px}
.tip-dialog .tip-warn{background:#fff3ea;border:1px solid #f5cfb4;border-radius:10px;padding:10px 14px;margin-top:12px;font-size:14px}
.tip-dialog .tip-warn b{color:#c2410c}
.tip-dialog .tip-warn ul{margin:4px 0 0;padding-left:18px}
@media (max-width:760px){.wr-field{grid-template-columns:1fr;gap:2px}.wr-bar{bottom:6px}}

/* town */
.town-wrap{background:#1b1838;border-radius:var(--radius);padding:16px 16px 12px;color:#ecebff}
.town-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:12px}
.town-head h1{font-size:21px;margin:0;color:#fff}
.town-sub{color:#a8a4d6;font-size:13px}
.town-btns{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.tbtn{border:1px solid #3d3875;background:#262256;color:#fff;border-radius:8px;padding:6px 12px;font-size:13.5px;font-weight:600}
.tbtn:hover{background:#332e6e}
.tbtn.on{background:#16a34a;border-color:#16a34a}
#town{display:block;width:100%;height:auto;margin:0 auto;image-rendering:pixelated;border-radius:10px;touch-action:none;outline:none;background:#000}
.town-help{margin:10px 2px 0;font-size:13px;color:#a8a4d6;text-align:center}
.town-help b{color:#fff}
.town-scroll{overflow-x:auto;border-radius:10px}
.main:has(.town-wrap){padding-bottom:14px}
@media (max-width:760px){.town-scroll #town{width:760px;max-width:none}.town-wrap{padding:12px 10px}}
#arcadeBox{position:fixed;inset:0;z-index:60;background:rgba(5,4,15,.72);display:grid;place-items:center;padding:16px}
.arcade-panel{width:min(980px,96vw);height:min(88vh,780px);background:#0d0b1e;border:3px solid #e9ecff;border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.arcade-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;color:#fff;background:#1b1838;font-size:15px}
.arcade-top span{display:flex;gap:10px;align-items:center}
.arcade-top a{color:#9fe8ff;font-size:13.5px}
.arcade-top button{border:1px solid #3d3875;background:#262256;color:#fff;border-radius:8px;padding:5px 10px;font-size:13px}
.arcade-panel iframe{flex:1;border:0;width:100%;background:#0d0b1e}
@media (max-width:1100px){.strip{grid-auto-columns:calc((100% - 24px)/2)}}
@media (max-width:760px){
  .app{display:block}
  .side{position:fixed;z-index:20;left:0;top:0;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.15)}
  .side.show{transform:none}
  .btn.menu-toggle{display:inline-flex;margin-bottom:16px}
  .main{padding:18px 16px 50px}
  .strip{grid-auto-columns:82%}
  .row-head h2{font-size:19px}
  .row-head .arrow{display:none}
  .detail-top{grid-template-columns:1fr}
  .paper{padding:22px 18px}
}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .side,.print-bar,.menu-toggle,.crumb{display:none!important}
  .main{padding:0}
  .sheet{box-shadow:none;margin:0;width:auto;min-height:0;page-break-after:always;break-after:page}
  .sheet:last-child{page-break-after:auto;break-after:auto}
  .md h2{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sheet-head td.k{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main" id="main"><div class="empty">불러오는 중…</div></main>
</div>

<script>
const S = {cfg:null, students:[], weeks:[], recs:[], roster:null, thumbs:{}};
const COLORS = [
  ["#1f8a43","#fff"],["#eeeeee","#e8590c"],["#f3ece2","#222"],["#2b4acb","#fff"],
  ["#ffd43b","#222"],["#7048e8","#fff"],["#e64980","#fff"],["#0c8599","#fff"]
];
const DECO = ["🕹️","🎮","👾","🚀","⭐","🐱","🧩","🏆"];
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = iso => { if(!iso) return ""; const d=new Date(iso); return `${d.getMonth()+1}/${d.getDate()}`; };
const fmtFull = iso => { if(!iso) return ""; const d=new Date(iso); return `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}.`; };

async function getJSON(url){ const r = await fetch(url + (url.includes("?")?"&":"?") + "t=" + Date.now()); if(!r.ok) throw new Error(url); return r.json(); }

/* ---------- data helpers ---------- */
function label(st){ return `학생 ${st.no}` + (st.nickname ? ` · ${st.nickname}` : ""); }
function stuIdx(st){ return S.students.indexOf(st); }
function findStu(repo){ return S.students.find(s => s.repo === repo); }
function findWeek(n){ return S.weeks.find(w => w.week === +n); }
function subs(repo, week){
  return S.recs.filter(r => r.repo === repo && r.week === +week).sort((a,b) => a.version - b.version);
}
function state(repo, week){
  const list = subs(repo, week); const last = list[list.length-1];
  if(!last) return {cls:"", text:"미제출", list, last:null, next:1};
  return {cls: last.version >= 2 ? "v2" : "v1", text:`v${last.version} 제출`, list, last, next:last.version+1};
}
function gameUrl(st){ return `/${st.repo}/play/`; }
function hubUrl(st){ return `/${st.repo}/`; }
function repoUrl(st){ return `https://github.com/${S.cfg.org}/${st.repo}`; }
function rawUrl(st, ref, path){ return `https://raw.githubusercontent.com/${S.cfg.org}/${st.repo}/${ref}/${path}`; }
function releaseUrl(st, week, v){
  const w = findWeek(week);
  const body = w && w.game ? "## 🛠 패치노트\n- 바뀐 점: \n- 고친 버그: \n- 다음 버전에서 할 일: " : "## 📝 제출 메모\n- 이번에 쓴 내용: \n- 선생님께 질문: ";
  const q = new URLSearchParams({tag:`week${week}-v${v}`, title:`${week}주차 v${v} 제출`, body});
  return `${repoUrl(st)}/releases/new?${q}`;
}
function rosterOf(st){ return S.roster ? S.roster[st.no] || S.roster[st.repo] || null : null; }

/* thumbnails: check once per student whether thumbnail.png exists */
function loadThumbs(){
  S.students.forEach(st => {
    const img = new Image();
    img.onload = () => { S.thumbs[st.repo] = img.src; document.querySelectorAll(`[data-thumb="${st.repo}"]`).forEach(el => setThumb(el, st)); };
    img.src = `${S.cfg.pagesBase}/${st.repo}/thumbnail.png`;
  });
}
function setThumb(el, st){ if(S.thumbs[st.repo] && !el.querySelector("img")){ const i=document.createElement("img"); i.src=S.thumbs[st.repo]; i.alt=""; el.prepend(i); el.querySelectorAll(".big,.deco").forEach(x=>x.remove()); } }

/* roster CSV: 번호,이름,학번 (header optional). Stays in this browser tab only. */
function parseRoster(text){
  const out = {};
  text.replace(/^﻿/,"").split(/\r?\n/).forEach(line => {
    const c = line.split(",").map(x => x.trim()); if(c.length < 2) return;
    let no = c[0].replace(/^game-/,""); if(!/^\d+$/.test(no)) return;
    no = no.padStart(2,"0"); out[no] = {name:c[1]||"", id:c[2]||""};
  });
  S.roster = Object.keys(out).length ? out : null;
  try{ S.roster ? sessionStorage.setItem("roster", JSON.stringify(out)) : sessionStorage.removeItem("roster"); }catch(_){}
  if(!S.roster) alert("명단을 읽지 못했어요. 한 줄에 '번호,이름,학번' 형식인지 확인해 주세요.");
}

function fitTown(){
  const cv = $("#town"); if(!cv) return;
  if(window.innerWidth <= 760){ cv.style.width = ""; cv.style.height = ""; return; }   // 휴대폰은 좌우로 밀어서 보기
  const box = cv.closest(".town-wrap"), help = box.querySelector(".town-help");
  const top = cv.getBoundingClientRect().top + window.scrollY;
  const bottomSpace = (help ? help.offsetHeight + 10 : 0) + 12 + 16;            // 안내 문구 + 상자 여백 + 페이지 여백
  const availH = Math.max(240, window.innerHeight - top - bottomSpace);
  const availW = (cv.parentElement.clientWidth || box.clientWidth);
  const ratio = cv.width / cv.height;
  const w = Math.floor(Math.min(availW, availH * ratio));
  cv.style.width = w + "px"; cv.style.height = Math.floor(w / ratio) + "px";
}

/* ---------- markdown ---------- */
async function fetchDoc(st, ref, path){
  const r = await fetch(rawUrl(st, ref, path));
  if(r.status === 404) return null;
  if(!r.ok) throw new Error(r.status);
  return r.text();
}
function renderMd(text){
  const html = DOMPurify.sanitize(marked.parse(text, {gfm:true, breaks:true}));
  const box = document.createElement("div"); box.innerHTML = html;
  box.querySelectorAll("p").forEach(p => {
    const t = p.textContent.trim();
    if(/^예\s*[:：)]/.test(t)) p.classList.add("ex");
    if(/^답\s*[:：]/.test(t)) p.classList.add("ans");
  });
  box.querySelectorAll("blockquote").forEach(b => { if(/작성 방법|Commit changes/.test(b.textContent)) b.classList.add("howto"); });
  box.querySelectorAll("a").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
  return box.innerHTML;
}
async function loadDetailDoc(st, w){
  const docEl = $("#doc"); if(!docEl) return;
  const i = +($(".tab.on")?.dataset.doc || 0); const ref = $("#verSel").value;
  docEl.innerHTML = `<div class="empty">문서를 불러오는 중…</div>`;
  try{
    const t = await fetchDoc(st, ref, w.docs[i].path);
    docEl.innerHTML = t == null ? `<div class="empty">아직 문서가 없어요. (저장소가 만들어지지 않았거나 파일이 없어요)</div>` : renderMd(t);
  }catch(e){ docEl.innerHTML = `<div class="empty">문서를 불러오지 못했어요. 잠시 뒤 다시 시도해 주세요.</div>`; }
}

  await Promise.all([...document.querySelectorAll("[data-sheet]")].map(async sh => {
    const st = findStu(sh.dataset.sheet); const s = state(st.repo, meta.week);
    let rec = null, ref = "main";
    if(meta.ver === "latest" && s.last){ rec = s.last; }
    else if(/^v\d+$/.test(meta.ver)){ rec = s.list.find(r => "v"+r.version === meta.ver) || null; }
    if(rec) ref = rec.tag;
    $("[data-date]", sh).textContent = rec ? fmtFull(rec.published_at) : "";
    $("[data-ver]", sh).textContent = rec ? `v${rec.version}` : "미제출 (작성 중 내용)";
    try{ const t = await fetchDoc(st, ref, meta.path);
      $("[data-doc]", sh).innerHTML = t == null ? `<div class="empty">문서가 없어요.</div>` : renderMd(t);
    }catch(e){ $("[data-doc]", sh).innerHTML = `<div class="empty">문서를 불러오지 못했어요.</div>`; }
  }));
}

/* ---------- router ---------- */
function parse(){
  const p = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean).map(decodeURIComponent);
  if(p[0] === "write" && p[2]) return {name:"write", week:p[1], repo:p[2], doc:p[3]||0};
  if(p[0] === "week" && p[2]) return {name:"detail", week:p[1], repo:p[2]};
  if(p[0] === "week") return {name:"week", week:p[1]};
  if(p[0] === "status") return {name:"status"};
  if(p[0] === "house" && p[1]) return {name:"house", repo:p[1]};
  if(p[0] === "print") return {name:"print", week:p[1], repos:p[2]||"", ver:p[3]||"latest", doc:p[4]||0};
  return {name:"home"};
}
function route_(){
  if(S.bounce){ S.bounce = false; return; }
  if(window.Writer && Writer.isDirty() && location.hash !== S.lastHash){
    if(!confirm("저장하지 않은 내용이 있어요. 저장하지 않고 나갈까요?")){ S.bounce = true; location.hash = S.lastHash; return; }
    Writer.reset();
  }
  S.lastHash = location.hash;
  const r = parse(); renderSide(r);
  const main = $("#main");
  if(window.Town) Town.stop();
  const tog = `<button class="btn menu-toggle" onclick="document.getElementById('side').classList.add('show')">☰ 메뉴</button>`;
  if(r.name === "home"){ main.innerHTML = tog + viewTown("village"); startTown("village"); }
  if(r.name === "house"){ main.innerHTML = tog + viewTown("house", r.repo); startTown("house", r.repo); }
  if(r.name === "week") main.innerHTML = tog + viewWeek(r.week);
  if(r.name === "status") main.innerHTML = tog + viewStatus();
  if(r.name === "write"){ main.innerHTML = tog + Writer.view(r.week, r.repo, r.doc); Writer.mount(r.week, r.repo, r.doc); }
  if(r.name === "print"){ main.innerHTML = tog + viewPrint(r.week, r.repos, r.ver, r.doc); loadPrintDocs(); }
  if(r.name === "detail"){
    main.innerHTML = tog + viewDetail(r.week, r.repo);
    const st = findStu(r.repo), w = findWeek(r.week);
    if(st && w){
      loadDetailDoc(st, w);
      main.querySelectorAll(".tab").forEach(b => b.onclick = () => { main.querySelectorAll(".tab").forEach(x => x.classList.remove("on")); b.classList.add("on"); loadDetailDoc(st, w); });
      $("#verSel").onchange = () => loadDetailDoc(st, w);
      $("#printBtn").onclick = e => { e.preventDefault(); const v = $("#verSel").value; const ver = v === "main" ? "main" : "v" + v.split("-v")[1];
        location.hash = `#/print/${w.week}/${st.repo}/${ver}/${$(".tab.on").dataset.doc}`; };
    }
  }
  main.querySelectorAll("[data-scroll]").forEach(b => b.onclick = () => {
    const strip = b.closest(".row").querySelector(".strip"); strip.scrollBy({left: +b.dataset.scroll * strip.clientWidth, behavior:"smooth"}); });
  main.querySelectorAll("[data-thumb]").forEach(el => setThumb(el, findStu(el.dataset.thumb)));
  if(r.name !== "print") window.scrollTo(0, 0);
}

(async function init(){
  try{
    const [cfg, stu, wk, sub] = await Promise.all([getJSON("config.json"), getJSON("students.json"), getJSON("weeks.json"), getJSON("data/submissions.json")]);
    S.cfg = cfg; S.students = stu.students; S.weeks = wk.weeks; S.recs = sub.records || []; S.updated = sub.updated;
  }catch(e){ $("#main").innerHTML = `<div class="empty">설정 파일을 불러오지 못했어요.</div>`; return; }
  try{ const r = sessionStorage.getItem("roster"); if(r) S.roster = JSON.parse(r); }catch(_){}
  window.addEventListener("hashchange", route_);
  route_(); loadThumbs();
})();
</script>
